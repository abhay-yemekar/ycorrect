<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>WriteRight synthetic smoke fixture</title>
<h1>WriteRight extension smoke fixture</h1>
<p>Use only synthetic text here. Review, reject, accept and undo; switch fields while requests are pending.</p>
<label>Textarea <textarea rows="8" cols="65">teh cat and teh dog. They was going to the store.</textarea></label>
<p><label>Text input <input type="text" value="teh cat"></label></p>
<h2>Rich editor with split nodes and repeated words</h2>
<div contenteditable="true" role="textbox" aria-label="Rich text fixture">
<p>teh cat and <strong>t</strong><em>eh</em> dog.</p>
<p>Another paragraph with a typo: teh.</p>
</div>
<h2>Credential controls — no writing badge expected</h2>
<label>Password <input type="password" autocomplete="current-password"></label>
<label>One-time code <input type="text" autocomplete="one-time-code"></label>
</html>
